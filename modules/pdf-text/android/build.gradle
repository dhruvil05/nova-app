plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pdftext'
version = '0.1.0'

android {
  namespace "expo.modules.pdftext"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles 'proguard-rules.pro'
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Apache-2.0. Android port of Apache PDFBox, used only to read embedded text.
  implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
